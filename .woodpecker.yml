when:
  - event: push

steps:
  # Gate: runs on every branch (incl. master).
  # Failure here stops the pipeline before any deploy.
  - name: check
    image: node:22-alpine
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm exec tsc --noEmit
      - pnpm lint
      - pnpm build

  - name: deploy-preview
    image: node:22-alpine
    commands:
      - corepack enable
      - npx vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
      - npx vercel build --token=$VERCEL_TOKEN
      - npx vercel deploy --prebuilt --token=$VERCEL_TOKEN
    environment:
      VERCEL_TOKEN:
        from_secret: vercel_token
      VERCEL_ORG_ID:
        from_secret: vercel_org_id
      VERCEL_PROJECT_ID:
        from_secret: vercel_project_id
    when:
      - branch:
          exclude: master

  - name: deploy-production
    image: node:22-alpine
    commands:
      - corepack enable
      - npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      - npx vercel build --prod --token=$VERCEL_TOKEN
      - npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
    environment:
      VERCEL_TOKEN:
        from_secret: vercel_token
      VERCEL_ORG_ID:
        from_secret: vercel_org_id
      VERCEL_PROJECT_ID:
        from_secret: vercel_project_id
    when:
      - branch: master

  - name: indexnow
    image: alpine:3
    commands:
      - apk add --no-cache curl
      - sleep 30
      - sh scripts/indexnow.sh
    failure: ignore
    when:
      - branch: master
